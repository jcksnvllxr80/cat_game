<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paws of Destiny</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      background: #1a1a2e;
      min-height: 100dvh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
    #game-container canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Three.js canvas behind Phaser */
    #three-canvas { z-index: 0; }
    /* Phaser canvas on top (transparent for UI only) */
    #game-container > canvas:not(#three-canvas) { z-index: 1; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
